name: Update School Calendar
on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update-calendar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch published Outlook calendar
        shell: bash
        run: |
          curl --fail --location --retry 3 --user-agent "Mozilla/5.0" "https://outlook.office365.com/owa/calendar/ac7c6e69607443cfb18c0dd54f9eb218@kingscollegedoha.com/48ffaa6d51c94e11b769eca4e9d0bf1513396824015002741116/calendar.ics" --output calendar.ics
      - name: Build calendar data
        run: python scripts/parse_calendar.py
      - name: Commit calendar
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add calendar.ics calendar.json
          git diff --cached --quiet && exit 0
          git commit -m "Update school calendar"
          git push
