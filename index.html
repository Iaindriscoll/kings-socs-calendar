<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>King's College Doha | Upcoming Events</title>
<style>
:root{--red:#cf033c;--gold:#c2a572;--tint:#f9f6f1;--ink:#252525}*{box-sizing:border-box}
html,body{margin:0;background:transparent;color:var(--ink);font-family:"Open Sans","Trebuchet MS",Arial,sans-serif}
.shell{width:100%;padding:8px;display:flex;justify-content:center}.card{width:min(100%,760px);overflow:hidden;border:1px solid var(--gold);border-radius:14px;background:#fff;box-shadow:0 3px 12px rgba(0,0,0,.08)}
.head{display:flex;align-items:center;justify-content:space-between;background:var(--red);color:#fff;padding:14px 20px}.head h1{margin:0;font-size:18px;letter-spacing:.11em}.head span{font-size:11px;letter-spacing:.08em;opacity:.9}
#SOCSCalendar{padding:8px 18px 16px}#SOCSCalendar h1{color:var(--red)!important;margin:12px 0 8px!important;font-size:18px!important;font-weight:700!important}
table.socs_day_events{width:100%!important;border-collapse:collapse!important;margin:0 0 12px!important}table.socs_day_events th{padding:8px!important;text-align:left!important;color:var(--red)!important;font-weight:700!important;background:var(--tint)!important}
table.socs_day_events td{padding:9px 8px!important;border-bottom:1px solid #eee!important;vertical-align:top!important;font-size:13px!important}table.socs_day_events td.Timings{white-space:nowrap!important;width:120px!important;font-weight:700!important}table.socs_day_events td.Venue{width:160px!important;color:#666!important}table.socs_day_events td.Title{font-weight:700!important}table.socs_day_events span.canc{color:var(--red)!important;font-weight:700!important}a{color:var(--red)}
@media(max-width:600px){.head{padding:12px 14px}.head h1{font-size:15px}#SOCSCalendar{padding:6px 10px 12px}table.socs_day_events td{font-size:12px!important;padding:7px 5px!important}table.socs_day_events td.Venue{width:auto!important}.head span{display:none}}
</style></head><body>
<div class="shell"><div class="card"><div class="head"><h1>NEXT 10 EVENTS AT KING'S</h1><span>KING'S COLLEGE DOHA</span></div><div id="SOCSCalendar"></div></div></div>
<script>var socsURL='https://www.socscms.com/socs/plugin/api.ashx?FT=&D=589-590-591-592-593-594-595-596-597-598-599-600-601-602-603&C=12769-12782-12756-12783-12774-12758-12781-12772-12767-12780-12757-12785-12778-12776-12759-12779-12770-12762-12777-12760-12773-12768-12786-12763-13996-12761-12764-12784-12765-12771-12766-12775&CC=&ET=Fixture-MultiSport-Training-Competition-SportEvent&Y=&H=&key=A27290A6-A93B-46E8-9E7A-FB53BED1AFE1';</script>
<script src="https://www.socscms.com/socs/plugin/api.js"></script>
<script>
(function(){
 const cal=document.getElementById('SOCSCalendar');

 function apply(){
   const tables=[...cal.querySelectorAll('table.socs_day_events')];
   let remaining=10;

   tables.forEach(table=>{
     const rows=[...table.querySelectorAll('tr')];
     const eventRows=rows.filter(r=>r.querySelector('td.Title') || (r.querySelectorAll('td').length>0 && r.textContent.trim().length>0));

     eventRows.forEach(row=>{
       const show=remaining>0;
       row.style.display=show?'':'none';
       if(show) remaining--;
     });

     const visible=eventRows.some(r=>r.style.display!=='none');
     table.style.display=visible?'':'none';

     let h=table.previousElementSibling;
     while(h && !/^H[1-6]$/.test(h.tagName)) h=h.previousElementSibling;
     if(h) h.style.display=visible?'':'none';
   });

   [...cal.querySelectorAll('h1,h2,h3,h4,h5,h6')].forEach(h=>{
     let n=h.nextElementSibling, hasVisible=false;
     while(n && !/^H[1-6]$/.test(n.tagName)){
       if(n.matches('table.socs_day_events') && n.style.display!=='none') hasVisible=true;
       n=n.nextElementSibling;
     }
     if(!hasVisible) h.style.display='none';
   });
 }

 let timer;
 const obs=new MutationObserver(()=>{clearTimeout(timer);timer=setTimeout(apply,80)});
 obs.observe(cal,{childList:true,subtree:true});
 [250,750,1500,3000,5000].forEach(ms=>setTimeout(apply,ms));
})();
</script></body></html>
